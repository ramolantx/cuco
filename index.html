<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a14">
<title>una canción</title>
<style>
/* ============ 1. COLORES Y ANIMACIONES (cámbialos aquí) ============ */
:root{
  --fondo:#060a14;            /* negro azulado */
  --fondo2:#0d1630;           /* azul muy oscuro */
  --texto:#e9eefb;            /* blanco suave */
  --tenue:#7f8db0;            /* texto secundario */
  --acento:#8fb4ff;           /* azul claro */
  --rosa:#e2b9c8;             /* rosa apagado, se usa muy poco */
  --cristal:rgba(255,255,255,.05);
  --borde:rgba(170,195,255,.16);
  --aparece:2.6s;             /* velocidad con la que aparecen los textos */
  --ancho-max:1100px;         /* ancho total del diseño en computadora */
  --espacio:64px;             /* separación entre reproductor y carta */
  --ancho-player:340px;       /* ancho del reproductor */
  --ancho-texto:460px;        /* ancho de la carta */
  --tam-texto:1.15rem;        /* tamaño de letra de la carta */
  --carta:#c9d3ec;            /* color del texto de la carta */
  --fuente:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--fondo)}
body{font-family:var(--fuente);color:var(--texto);min-height:100dvh;
  background:radial-gradient(ellipse at 50% 20%,var(--fondo2),var(--fondo) 70%) fixed}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;min-height:100dvh;width:100%;max-width:var(--ancho-max);margin:0 auto;
  display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:var(--espacio);
  padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(env(safe-area-inset-bottom,0px) + 28px)}

/* Carta / frases (lado derecho en computadora, debajo en celular) */
.carta{width:100%;max-width:var(--ancho-texto);justify-self:start}
.carta h2{font-size:.85rem;font-weight:500;color:var(--tenue);margin-bottom:1.4rem;letter-spacing:.02em}
.t{font-size:var(--tam-texto);line-height:1.65;color:var(--carta);margin-bottom:1rem;opacity:0;transform:translateY(6px);filter:blur(4px);
  transition:opacity var(--aparece) ease,transform var(--aparece) ease,filter var(--aparece) ease}
.t.show{opacity:1;transform:none;filter:none}
.t.grande{font-size:calc(var(--tam-texto) * 1.3);color:var(--texto)}
.t.grande.show{text-shadow:0 0 18px rgba(143,180,255,.35)}
.t.fin{font-size:.9rem;color:var(--tenue)}

/* Celular: música arriba, texto debajo */
@media (max-width:820px){
  .wrap{grid-template-columns:1fr;justify-items:center;align-content:start;gap:2rem}
  .carta{justify-self:center;max-width:var(--ancho-player)}
  :root{--tam-texto:1.05rem}
}

/* Reproductor */
.player{width:100%;max-width:var(--ancho-player);justify-self:center;display:flex;flex-direction:column;align-items:stretch;gap:.9rem;
  padding:18px;border-radius:26px;background:var(--cristal);border:1px solid var(--borde);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.cover{width:100%;aspect-ratio:1/1;border-radius:18px;background-size:cover;background-position:center;cursor:pointer;
  background-image:radial-gradient(circle at 30% 28%,rgba(143,180,255,.55),transparent 45%),
                   radial-gradient(circle at 75% 80%,rgba(226,185,200,.28),transparent 50%),
                   linear-gradient(160deg,#16244d,#070c1c);
  box-shadow:0 18px 40px rgba(0,0,0,.45);transition:transform .6s ease}
.cover.playing{transform:scale(1.015)}
.sub{font-size:.8rem;color:var(--tenue);margin-top:.3rem}
h1{font-size:1.25rem;font-weight:600;letter-spacing:.005em}

/* Barra de progreso y volumen */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;touch-action:manipulation}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;
  background:linear-gradient(to right,var(--acento) var(--p,0%),rgba(255,255,255,.14) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--acento)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-4.5px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
.tiempos{display:flex;justify-content:space-between;font-size:.72rem;color:var(--tenue);margin-top:-.2rem;font-variant-numeric:tabular-nums}
.controles{display:flex;align-items:center;justify-content:space-between;gap:10px}
button{font-family:inherit;color:var(--texto);background:none;border:0;cursor:pointer;touch-action:manipulation;transition:transform .15s,opacity .3s}
button:active{transform:scale(.9)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acento);outline-offset:3px;border-radius:8px}
.icono{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--tenue)}
.icono svg{width:20px;height:20px;fill:currentColor}
.icono:hover{color:var(--texto)}
#play{width:60px;height:60px;border-radius:50%;background:var(--texto);color:#0a1020;display:grid;place-items:center;
  box-shadow:0 0 22px rgba(143,180,255,.25)}
#play svg{width:24px;height:24px;fill:currentColor}
.vol{display:flex;align-items:center;gap:6px;width:112px}
#nota{font-size:.72rem;color:var(--tenue);text-align:center;min-height:1em}

@media (prefers-reduced-motion:reduce){.t{transition-duration:.4s}.cover{transition:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<main class="wrap">
  <section class="player" aria-label="Reproductor">
    <div class="cover" id="portada" role="button" aria-label="Reproducir"></div>
    <div>
      <p class="sub" id="sub"></p>
      <h1 id="nombre"></h1>
    </div>
    <div>
      <input type="range" id="barra" min="0" max="1000" value="0" aria-label="Progreso">
      <div class="tiempos"><span id="actual">0:00</span><span id="total">0:00</span></div>
    </div>
    <div class="controles">
      <button class="icono" id="mute" aria-label="Activar o desactivar música"></button>
      <button id="play" aria-label="Reproducir o pausar"></button>
      <div class="vol"><input type="range" id="vol" min="0" max="100" aria-label="Volumen"></div>
    </div>
    <p id="nota"></p>
  </section>

  <section class="carta" aria-label="Carta">
    <h2 id="cartaTitulo"></h2>
    <div id="cartaTexto"></div>
  </section>
</main>

<script>
/* ============ 2. CANCIÓN Y AJUSTES ============ */
const CFG = {
  cancion: "loquesiento.mp3",                 // archivo de la canción (misma carpeta)
  nombre: "Lo Que Siento",      // <- cámbialo
  subtitulo: "una canción que me recuerda a ti...",
  portada: "cucoportada.jfif",                         // opcional: "portada.jpg" (si lo dejas vacío se usa el degradado)
  volumen: 0.7,                        // 0 a 1
  duracionRespaldo: 150,               // segundos simulados si song.mp3 no carga
  particulas: 55                       // cantidad de luces de fondo (0 para quitarlas)
};

/* ============ 3. CARTA / FRASES (lado derecho) ============
   Cada línea es un párrafo. Escribe una carta larga o frases sueltas.
   at = en qué punto de la canción aparece (0 = inicio, 1 = final)
   cls = estilo opcional: "grande" (destacada) o "fin" (pequeña)          */
const CARTA_TITULO = "";              // opcional, ej: "para ti" (déjalo vacío para no mostrarlo)
const REVELAR_CON_CANCION = true;     // true = aparecen mientras suena · false = todo visible desde el inicio
const TEXTOS = [
  { t:"me gusta tu sonrisa",         at:0.01 },
  { t:"me gustan tus ojitos",     at:0.02 },
  { t:"me gusta brazarte",          at:0.03 },
  { t:"y pasar tiempo juntos",  at:0.04 },
  { t:"y pues, si...",            at:0.05 },
  { t:"aun me gustas..",                at:0.06, cls:"grande" },
  { t:"eso era todo <3",             at:0.07, cls:"fin" }
];

/* ============ 4. PREPARAR LA PÁGINA ============ */
const $ = id => document.getElementById(id);
const ICON = {
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  sonido:'<svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10zM16 8.5a5 5 0 0 1 0 7l-1.2-1.2a3.3 3.3 0 0 0 0-4.6z"/></svg>',
  mudo:'<svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10zM15 9.6l1.4-1.4 2.1 2.1 2.1-2.1L22 9.6l-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1L15 13.8l2.1-2.1z"/></svg>'
};
$("sub").textContent = CFG.subtitulo;
$("nombre").textContent = CFG.nombre;
if (CFG.portada) $("portada").style.backgroundImage = `url("${CFG.portada}")`;
$("play").innerHTML = ICON.play;
$("mute").innerHTML = ICON.sonido;
$("vol").value = CFG.volumen * 100;
pintarRango($("vol"));

$("cartaTitulo").textContent = CARTA_TITULO;
$("cartaTitulo").style.display = CARTA_TITULO ? "" : "none";
const nodos = TEXTOS.map(x => {
  const p = document.createElement("p");
  p.className = "t " + (x.cls || "");
  p.textContent = x.t;
  $("cartaTexto").appendChild(p);
  return { el:p, at:x.at, hecho:false };
});
function pintarRango(r){ r.style.setProperty("--p", (r.value / r.max * 100) + "%"); }
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };

/* ============ 5. MÚSICA (solo empieza al tocar play) ============ */
const audio = new Audio();
audio.preload = "metadata";
audio.src = CFG.cancion;
audio.volume = CFG.volumen;
let respaldo = false, simCur = 0, simPlaying = false, simTimer = null;

const dur = () => respaldo ? CFG.duracionRespaldo : (audio.duration || 0);
const cur = () => respaldo ? simCur : audio.currentTime;
const sonando = () => respaldo ? simPlaying : !audio.paused;

function toggle(){
  if (respaldo){
    simPlaying = !simPlaying;
    if (simPlaying && !simTimer) simTimer = setInterval(() => {
      if (!simPlaying) return;
      simCur += .25;
      if (simCur >= dur()){ simCur = dur(); simPlaying = false; final(); }
      actualizar();
    }, 250);
    return actualizar();
  }
  if (audio.paused) audio.play().catch(() => modoRespaldo());
  else audio.pause();
}
function modoRespaldo(){
  respaldo = true;
  $("nota").textContent = "no encuentro song.mp3 (pon el archivo junto a index.html)";
  toggle();
}
function seguir(el){   // en celular, baja suavemente para que se vea el texto nuevo
  if (innerWidth <= 820 && sonando()) el.scrollIntoView({ behavior:"smooth", block:"nearest" });
}
function final(){ nodos.forEach(n => { n.hecho = true; n.el.classList.add("show"); }); }
function actualizar(){
  const d = dur(), c = cur();
  if (d){ $("barra").value = c / d * 1000; }
  pintarRango($("barra"));
  $("actual").textContent = fmt(c);
  $("total").textContent = fmt(d);
  $("play").innerHTML = sonando() ? ICON.pause : ICON.play;
  $("portada").classList.toggle("playing", sonando());
  if (d) nodos.forEach(n => {
    if (!n.hecho && c / d >= n.at){ n.hecho = true; n.el.classList.add("show"); seguir(n.el); }
  });
}
["timeupdate","loadedmetadata","play","pause","durationchange"].forEach(e => audio.addEventListener(e, actualizar));
audio.addEventListener("ended", () => { final(); actualizar(); });
audio.addEventListener("error", () => { if (!respaldo) { respaldo = true; $("nota").textContent = "no encuentro song.mp3 (pon el archivo junto a index.html)"; actualizar(); } });

$("play").addEventListener("click", toggle);
$("portada").addEventListener("click", toggle);
$("barra").addEventListener("input", e => {
  const d = dur(); if (!d) return;
  const t = e.target.value / 1000 * d;
  if (respaldo) simCur = t; else audio.currentTime = t;
  actualizar();
});
$("vol").addEventListener("input", e => {
  audio.volume = e.target.value / 100; audio.muted = false;
  pintarRango(e.target); $("mute").innerHTML = audio.volume ? ICON.sonido : ICON.mudo;
});
$("mute").addEventListener("click", () => {
  audio.muted = !audio.muted;
  $("mute").innerHTML = audio.muted ? ICON.mudo : ICON.sonido;
});
actualizar();
if (!REVELAR_CON_CANCION) setTimeout(final, 300);

/* ============ 6. LUCES DE FONDO (reaccionan suavemente al play) ============ */
const cv = $("cv"), cx = cv.getContext("2d");
let W, H, DPR, luces = [], energia = 0;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  luces = Array.from({length:CFG.particulas}, () => ({
    x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.5+.4,
    v:Math.random()*.15+.03, ph:Math.random()*6.28, rosa:Math.random() < .1 }));
}
function dibujar(){
  const t = performance.now() / 1000;
  energia += ((sonando() ? 1 : 0) - energia) * .02;   // sube suave al dar play
  const pulso = 1 + energia * .25 * Math.sin(t * 2.4); // latido muy leve
  cx.clearRect(0, 0, W, H);
  luces.forEach(l => {
    l.y -= l.v * (1 + energia * .8);
    if (l.y < -3){ l.y = H + 3; l.x = Math.random()*W; }
    const b = .5 + .5 * Math.sin(t * .9 + l.ph);
    cx.globalAlpha = (.18 + .45 * b) * (.7 + energia * .5);
    cx.fillStyle = l.rosa ? "#e2b9c8" : "#cfe0ff";
    cx.beginPath(); cx.arc(l.x, l.y, l.r * pulso, 0, 6.28); cx.fill();
  });
  cx.globalAlpha = 1;
  requestAnimationFrame(dibujar);
}
addEventListener("resize", resize);
resize(); dibujar();
</script>
</body>
</html>
